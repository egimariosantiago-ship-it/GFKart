<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GF Innovation Kart</title>
<style>
:root{--bg:#0d0b1e;--bd:#ffd600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

</style></head><body>
<div id="w"><canvas id="c" width="640" height="400"></canvas><div id="tb"><button onclick="pauseT()">⏸</button><button id="mb" onclick="muteT()">🔊</button></div><div id="ui"></div><div id="pad"><button id="bl" aria-label="Esquerda">◀</button><button id="br" aria-label="Direita">▶</button></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),ui=$('ui'),W=320,H=200,HOR=82,LAPS=2,L=3600,MAXSP=1.8;
let S={coins:0,own:[1,0,0,0],sel:0,acc:0,wins:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('gfk')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('gfk',JSON.stringify(S))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rel=d=>((d%L)+L+L/2)%L-L/2,rnd=(a,b)=>a+Math.random()*(b-a);
const MODELS=[['Rocket','#e53935',0],['Turbo GT','#1e88e5',300],['Neon X','#00e5ff',600],['Ouro Tech','#ffca28',1000]],ACC=['#ffffff','#111111','#ff2bd6','#76ff03'];
const TR=[
{n:'GREEN CIRCUIT',sky:['#4fc3f7','#b3e5fc'],hill:'#2e7d32',sun:'#fff59d',g1:'#2e9b2e',g2:'#278a27',r1:'#6b6b72',r2:'#63636a',b1:'#e53935',b2:'#fff',ln:'#fff',sc:0,cv:[0,0,.7,0,-.9,0,.6,.6,0,-.7,0,1,0,-.5],ob:.03,ai:.86},
{n:'DESERT CIRCUIT',sky:['#ff8a65','#ffe0b2'],hill:'#a1664a',sun:'#fff',g1:'#e8c36a',g2:'#dcb55c',r1:'#8d6e63',r2:'#85675d',b1:'#fff',b2:'#ff7043',ln:'#ffe082',sc:1,cv:[0,1.1,-1.1,.8,0,-1.2,1.2,0,-1,1,0,-1.1],ob:.045,ai:.92},
{n:'TECHNOLOGY CIRCUIT',sky:['#0a0020','#3a0a6a'],hill:'#1a0a40',sun:'#ff2bd6',g1:'#10052a',g2:'#190b3a',r1:'#25253f',r2:'#1d1d33',b1:'#00e5ff',b2:'#ff2bd6',ln:'#00e5ff',sc:2,cv:[0,-1.3,1.3,0,1.4,-1.4,0,-1,1.1,1.3,-1.3,0],ob:.06,ai:.98}];
TR.forEach(t=>{const n=t.cv.length,a=[],M=L/10;for(let i=0;i<M;i++)a.push(t.cv[Math.floor(i*n/M)]);t.C=a.map((_,i)=>{let s=0;for(let k=-12;k<=12;k++)s+=a[(i+k+M)%M];return s/25})});
const OB=[['#c62828','#fff','Falha nos controles financeiros'],['#6a1b9a','#e1bee7','Dados inconsistentes'],['#1565c0','#90caf9','Concorrência consolidada'],['#212121','#00e676','Risco cibernético'],['#ef6c00','#ffe0b2','Mudança tecnológica']];
const IT=[['📊','Painel de indicadores','Gestão baseada em dados','TURBO'],['💰','Reserva de caixa','Gestão financeira','MOEDAS +50'],['🔒','Segurança e LGPD','Proteção de dados','ESCUDO'],['🚀','Investir em tecnologia','Inovação e IA','IMPULSO'],['🤝','Parcerias estratégicas','Escritórios e entidades','ÍMÃ'],['🎯','Diferencial competitivo','Planos e personalização','RAIO']];
let st='menu',T=TR[0],tIdx=0,pos=0,px=0,sp=0,tm=0,coinsRun=0,fx={},objs=[],decos=[],cars=[],msg={t:0},parts=[],keys={},shake=0,fin=0,cdn=0,hitT=0,goT=0,finD=0,ended=0,place=0,bg=0,prev='',cen=new Float32Array(2*H),hw=new Float32Array(2*H),demoT=0;
function setT(i){tIdx=i;T=TR[i];decos=[];for(let k=0,z=0;z<L;z+=26,k++)decos.push({z,lx:(k%2?1:-1)*(1.5+((k*7)%5)*.12),v:T.sc})}
function startRace(i){picks=[];hits=[];blk=0;setT(i);pos=0;px=0;sp=0;tm=0;coinsRun=0;fx={turbo:0,shield:0,boost:0,magnet:0,raio:0};hitT=0;msg={t:0};parts=[];fin=0;cdn=215;goT=0;finD=0;ended=0;objs=[];
 for(let i=0;i<T.ob*400;i++)objs.push({z:rnd(200,L-20),lx:[-.67,0,.67][Math.floor(rnd(0,3))],k:'o',t:Math.floor(rnd(0,5)),cd:0});
 for(let i=0;i<40;i++)objs.push({z:rnd(150,L-20),lx:[-.67,0,.67][Math.floor(rnd(0,3))],k:'b',t:Math.floor(rnd(0,6)),cd:0});
 for(let i=0;i<9;i++){const z=rnd(150,L-100),x=rnd(-.7,.7);for(let j=0;j<6;j++)objs.push({z:z+j*8,lx:x,k:'c',cd:0})}
 const w=Math.min(S.wins,5)*.008;
 cars=[['Byte','#43a047',.97,-.5],['Cloud','#8e24aa',1,.5],['Pixel','#fb8c00',.93,-.22],['Nimbus','#00acc1',1.02,.25]].map((c,i)=>({n:c[0],col:c[1],sk:c[2]*(1+w),z:-6*(i+1),lx:c[3],tg:c[3],sp:0,stun:0,fin:0,tb:0}));
 st='count';ui.style.display='none';ac()}
function demo(){setT(demoT%3);pos=0;objs=[];cars=['#43a047','#8e24aa','#fb8c00','#00acc1'].map((c,i)=>({col:c,z:30+i*28,lx:[-.5,.5,-.2,.3][i],n:''}));st='menu';sp=2.4}
// áudio
let AC,mute=false,eng,step_=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty,v,f2){if(mute||!AC)return;const o=AC.createOscillator(),n=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v||.06,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(AC.destination);o.start();o.stop(t+d)}
const MEL=[262,330,392,523,392,330,294,349,440,587,440,349,262,330,392,659];
setInterval(()=>{if(mute||!AC||st==='pause'||st==='fin')return;tone(MEL[step_%16],.15,'square',.025);if(step_%2==0)tone(MEL[step_%16]/4,.2,'triangle',.05);step_++},170);
function engine(){if(!AC)return;if(!eng){const o=AC.createOscillator(),n=AC.createGain();o.type='sawtooth';n.gain.value=0;o.connect(n);n.connect(AC.destination);o.start();eng={o,n}}
 eng.o.frequency.value=45+sp*28;eng.n.gain.value=(!mute&&(st==='race'))?.018:0}
function fanfare(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.07),i*140))}
function muteT(){mute=!mute;$('mb').textContent=mute?'🔇':'🔊';ac()}
// UI
function show(h){ui.innerHTML=h;ui.style.display='flex'}
function menu(){demo();show(`<div class=p><div class=logo>GF INNOVATION<br>KART</div><div class=s>Projeto A3 · Teorias Organizacionais · GF Innovation &amp; Tech Development</div><div style="margin:8px 0"><button class=b onclick="selTrack()">▶ JOGAR</button><br><button class=b onclick="garage()">GARAGEM</button><button class=b onclick="info()">INSTRUÇÕES</button><button class=b onclick="cred()">CRÉDITOS</button></div><div class=s>$ ${S.coins} · Vitórias: ${S.wins}</div></div>`)}
function selTrack(){ac();let h='<div class=p><div class=logo style="font-size:22px">ESCOLHA A PISTA</div>';TR.forEach((t,i)=>h+=`<div class=row><button class=b onclick="startRace(${i})">${t.n}</button><span>${'★'.repeat(i+1)}${'☆'.repeat(2-i)}</span></div>`);show(h+'<button class=b onclick="menu()">VOLTAR</button></div>')}
function info(){show(`<div class=p style="text-align:left"><div class=logo style="font-size:22px;text-align:center">INSTRUÇÕES</div>Acelera sozinho! Vire com <b>A / ←</b> e <b>D / →</b> (no celular, toque na metade esquerda ou direita). <b>P</b> pausa.<br><br>🟨 <b>Caixinhas</b> = oportunidades (item aleatório)<br>⚡ Turbo = inovação digital · 🪙 Moedas = recursos financeiros · 🛡 Escudo = segurança de dados · 🚀 Impulso = investimento em tecnologia · 🧲 Ímã atrai moedas · ⚡ Raio freia a concorrência<br>⬛ <b>Obstáculos</b> = fraquezas: controles financeiros, dados inconsistentes, concorrência consolidada, risco cibernético, mudança tecnológica<br>🏎 <b>Rivais</b> = ameaças competitivas<br><br><div style="text-align:center"><button class=b onclick="menu()">VOLTAR</button></div></div>`)}
function cred(){show(`<div class=p><div class=logo style="font-size:22px">CRÉDITOS</div>Projeto A3 — Teorias Organizacionais<br>Ciências Contábeis · Universidade São Judas Tadeu<br>Empresa: GF Innovation &amp; Tech Development Ltda.<br><div class=s>Carros e personagens originais, sem arte oficial de terceiros. Obstáculos e itens são representações educativas do diagnóstico SWOT, não fatos reais da empresa.</div><button class=b onclick="menu()">VOLTAR</button></div>`)}
function garage(){let h=`<div class=p><div class=logo style="font-size:22px">GARAGEM</div>$ ${S.coins}`;MODELS.forEach((m,i)=>h+=`<div class=row><span class=sw style="background:${m[1]}"></span>${m[0]}<button class=b onclick="buy(${i})">${S.own[i]?(S.sel==i?'EM USO':'USAR'):'$'+m[2]}</button></div>`);
 h+='<div class=row>Detalhe: ';ACC.forEach((a,i)=>h+=`<span class=sw onclick="S.acc=${i};save();garage()" style="background:${a};cursor:pointer;${S.acc==i?'outline:2px solid #ffd600':''}"></span>`);show(h+'</div><div class=s>Vença pistas para desbloquear carros de graça.</div><button class=b onclick="menu()">VOLTAR</button></div>')}
function buy(i){if(S.own[i])S.sel=i;else if(S.coins>=MODELS[i][2]){S.coins-=MODELS[i][2];S.own[i]=1;S.sel=i}else tone(120,.25,'sawtooth');save();garage()}
function pauseT(){ac();if(st==='race'||st==='count'){prev=st;st='pause';show(`<div class=p><div class=logo style="font-size:26px">PAUSA</div><button class=b onclick="pauseT()">CONTINUAR</button><br><button class=b onclick="startRace(tIdx)">REINICIAR</button><button class=b onclick="menu()">MENU</button></div>`)}else if(st==='pause'){st=prev;ui.style.display='none'}}
function showEnd(){ended=1;const pl=place,bonus=[200,100,50,0][Math.min(pl-1,3)],tot=coinsRun+bonus;S.coins+=tot;let un='';
 if(pl===1){S.wins++;if(tIdx<3&&!S.own[tIdx+1]){S.own[tIdx+1]=1;un=`<div style="color:#76ff03">🔓 Novo carro desbloqueado: ${MODELS[tIdx+1][0]}!</div>`}}save();
 const all=[{n:'VOCÊ',f:finT(),me:1},...cars.map(a=>({n:a.n.toUpperCase(),f:a.fin||0,z:a.z}))].sort((a,b)=>(a.f||1e9-a.z)-(b.f||1e9-b.z));
 const ti=['CAMPEÃO!','VICE-CAMPEÃO!','PÓDIO! 3º LUGAR','NÃO FOI DESTA VEZ'][Math.min(pl-1,3)];
 show(`<div class=p><div class=logo style="font-size:${pl===1?34:24}px">${ti}</div>Colocação: ${pl}º · Tempo: ${fmt(finT())}<br>🪙 Corrida: ${coinsRun} + bônus ${bonus} = <b>$ ${tot}</b> (saldo $ ${S.coins})${un}<div style="margin:6px auto;text-align:left;display:inline-block">${all.map((r,i)=>`<div style="${r.me?'color:#ffd600':''}">${i+1}º ${r.n}</div>`).join('')}</div><br><button class=b onclick="startRace(tIdx)">JOGAR NOVAMENTE</button><button class=b onclick="menu()">MENU PRINCIPAL</button></div>`)}
let finTm=0;const finT=()=>finTm,fmt=f=>{const s=f/60;return Math.floor(s/60)+':'+('0'+(s%60).toFixed(1)).slice(-4)};
// lógica
function msgSet(t,c){msg={t:130,txt:t,col:c}}
function upd(){
 if(st==='menu'){demoT++;pos+=sp;px=Math.sin(pos*.012)*.5;bg+=cAt(pos)*sp*.1;cars.forEach(a=>a.z+=2.2+(a.lx>0?.2:.1));if(demoT%900===0){setT((tIdx+1)%3)}return}
 if(st==='count'){const o=cdn;cdn--;if(Math.floor(o/60)!==Math.floor(cdn/60)&&cdn>30)tone(440,.2,'square',.08);if(cdn<=30){st='race';goT=50;tone(880,.5,'square',.1);}return}
 tm++;if(goT>0)goT--;
 if(st==='fin'){finD++;sp*=.99;if(parts.length<400){for(let i=0;i<3;i++)parts.push({x:rnd(0,W),y:-4,vx:rnd(-.5,.5),vy:rnd(.8,2),c:['#ffd600','#e53935','#00e5ff','#76ff03','#ff2bd6'][Math.floor(rnd(0,5))],l:200,cf:1})}
  if(finD%28===0&&place<4){const x=rnd(50,270),y=rnd(20,80),c=['#ffd600','#ff2bd6','#00e5ff'][finD%3];tone(300,.3,'sawtooth',.04,80);for(let i=0;i<26;i++){const a=i/26*6.28;parts.push({x,y,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,c,l:50})}}
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(!p.cf)p.vy+=.03;p.l--});parts=parts.filter(p=>p.l>0&&p.y<H+5);if(finD===170&&!ended)showEnd()}
 else{
  const dir=(keys.r?1:0)-(keys.l?1:0),off=Math.abs(px)>1.02;
  const tg=MAXSP*(fx.turbo?1.45:fx.boost?1.3:1)*(off?.55:1)*(hitT>0?.55:1);
  sp+=(tg-sp)*.03+(sp<tg?.01:0);
  px=clamp(px+dir*.034*(.45+sp/MAXSP*.55)-cAt(pos+8)*sp*.0065,-1.6,1.6);
  pos+=sp;bg+=cAt(pos)*sp*.1;if(off)shake=2;
  for(const k in fx)if(fx[k]>0)fx[k]--;if(hitT>0)hitT--;
  for(const o of objs){if(o.cd>0){o.cd--;continue}const d=rel(o.z-pos);
   if(o.k==='c'&&fx.magnet&&d>-3&&d<38){o.cd=800;coinsRun+=10;tone(1200,.08,'square',.05);continue}
   if(Math.abs(d)<4&&Math.abs(o.lx-px)<.3){
    if(o.k==='o'){if(fx.shield){o.cd=2000;blk++;tone(500,.2,'triangle',.08);msgSet('Escudo bloqueou: '+OB[o.t][2],'#00e5ff')}else{hitT=55;sp*=.5;shake=8;o.cd=2000;hits[o.t]=(hits[o.t]||0)+1;tone(110,.3,'sawtooth',.1,50);msgSet('✖ '+OB[o.t][2],'#c62828')}}
    else if(o.k==='b'){o.cd=600;const i=o.t;picks.push({i,v:Math.floor(pos/L)+1});[()=>fx.turbo=150,()=>coinsRun+=50,()=>fx.shield=360,()=>fx.boost=100,()=>fx.magnet=420,()=>fx.raio=240][i]();tone(600,.3,'square',.08,1200);msgSet(IT[i][0]+' '+IT[i][1]+' → '+IT[i][3],'#2e7d32')}
    else{o.cd=800;coinsRun+=10;tone(1300,.08,'square',.06)}}}
  if(pos>=LAPS*L&&!fin){fin=1;finTm=tm;st='fin';finD=0;place=1+cars.filter(a=>a.fin).length;sp=Math.max(sp,1.5);if(place<4)fanfare();else tone(150,.6,'sawtooth',.08,60)}}
 for(const a of cars){if(a.stun>0)a.stun--;if(a.tb>0)a.tb--;const lead=pos-a.z;
  let tg=MAXSP*T.ai*a.sk*(lead>250?1.07:lead<-250?.95:1)*(fx.raio>0?.65:1)*(a.stun>0?.5:1)*(a.tb>0?1.25:1)*(a.fin?.7:1);a.sp+=(tg-a.sp)*.03;
  let dg=0;for(const o of objs){if(o.cd>0)continue;const d=rel(o.z-a.z);if(o.k==='o'){if(d>2&&d<40&&Math.abs(o.lx-a.lx)<.28)dg=o.lx>=a.lx?-1:1;if(Math.abs(d)<3.5&&Math.abs(o.lx-a.lx)<.25){a.stun=40;a.sp*=.6;o.cd=2000}}else if(o.k==='b'&&Math.abs(d)<3.5&&Math.abs(o.lx-a.lx)<.3){o.cd=600;a.tb=90}}
  for(const q of [{z:pos,lx:px},...cars]){if(q===a)continue;const d=rel(q.z-a.z);if(d>0&&d<14&&Math.abs(q.lx-a.lx)<.3)dg=a.lx>=q.lx?1:-1;if(Math.abs(d)<2.5&&Math.abs(q.lx-a.lx)<.22){a.sp*=.97}}
  a.lx=clamp(a.lx+(dg?dg*.022:(a.tg-a.lx)*.01),-.88,.88);a.z+=a.sp;if(a.z>=LAPS*L&&!a.fin)a.fin=tm||1;
  if(st!=='menu'&&Math.abs(rel(a.z-pos))<2.5&&Math.abs(a.lx-px)<.22&&a.z<pos+5){sp*=.94}}
 engine()}
const cAt=z=>0;
// desenho
const R=(X,Y,s,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(X+x*s),Math.round(Y+y*s),Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s)))};
function carS(X,Y,s,c,a){R(X,Y,s,-8,-4,3,4,'#111');R(X,Y,s,5,-4,3,4,'#111');R(X,Y,s,-7,-11,14,1,'#222');R(X,Y,s,-6,-7,12,5,c);R(X,Y,s,-5,-10,10,3,c);R(X,Y,s,-4,-9.5,8,2,'#9ef');R(X,Y,s,-6,-5,2,1,'#ff3');R(X,Y,s,4,-5,2,1,'#ff3');R(X,Y,s,-1,-7,2,3,a||'#fff');R(X,Y,s,-3,-2,6,1,'#333')}
function drawS(o,X,Y,s,y){
 if(o.f==='car')carS(X,Y,s,o.c,'#fff');
 else if(o.f==='o'){const c=OB[o.t];R(X,Y,s,-6,-9,12,9,c[0]);R(X,Y,s,-6,-9,12,2,c[1]);R(X,Y,s,-2,-5,4,3,c[1])}
 else if(o.f==='b'){const b=Math.sin(tm/8+o.d)*1.5;R(X,Y,s,-5,-12+b,10,10,'#ffb300');R(X,Y,s,-5,-12+b,10,1,'#fff');R(X,Y,s,-2,-10+b,4,1,'#fff');R(X,Y,s,1,-9+b,1,2,'#fff');R(X,Y,s,-1,-7+b,2,1,'#fff');R(X,Y,s,-1,-5+b,1,1,'#fff')}
